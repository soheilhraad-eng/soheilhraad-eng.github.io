title: Sohi
# Placeholder until the throughline is settled — see "Still open" in README.md.
description: AI applications, multilingual tools and simulations, built remotely with creative people wherever they work.
url: "https://soheilhraad-eng.github.io"
baseurl: ""
lang: en
# Uncomment and set to your own zone, e.g. Asia/Tehran or Europe/London. Without it,
# a post dated "today" can count as future on GitHub's servers and silently not publish.
# timezone: Europe/London

author:
  name: Sohi
  github: soheilhraad-eng

# Where the home page's "Start a project" button goes. Change this to an email
# (mailto:you@example.com), a contact form or LinkedIn once you've picked one.
contact_url: https://github.com/soheilhraad-eng

permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Every page names its language (`lang`) and a shared `ref`; pages with the same `ref` are
# translations of each other, which is how the language switcher finds them. English is the
# default and lives at the root; the others live under /es/ and /fa/. Interface text for all
# three is in _data/i18n.yml.
languages: [en, es, fa]

# The link-preview picture used when a page is shared (WhatsApp, LinkedIn, ...). A page can
# set its own `image:` to override it.
twitter:
  card: summary_large_image

defaults:
  - scope: { path: "" }
    values: { lang: en, locale: en_GB, image: /assets/img/og.png }
  - scope: { path: "es" }
    values: { lang: es, locale: es_ES }
  - scope: { path: "fa" }
    values: { lang: fa, locale: fa_IR }

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
