title: dos
full_name: "Design of سهی"
description: Small tools for people between languages.
url: "https://soheilhrad.github.io"
baseurl: ""
lang: en
# Uncomment and set to your own zone, e.g. Asia/Tehran or Europe/London. Without it,
# a post dated "today" can count as future on GitHub's servers and silently not publish.
# timezone: Europe/London

author:
  name: dos
  github: soheilhrad

# TODO(owner): a contact address. The "Write to us" line on the home page stays hidden
# while this is empty.
email: ""

# Where the home page's "Start a project" button goes. Change this to an email
# (mailto:you@example.com), a contact form or LinkedIn once you've picked one.
contact_url: https://github.com/soheilhrad

# The address of the Marco chat Worker (see worker/README.md). Empty = the chat box is hidden.
chat_endpoint: "https://marco.soheilhraad-0e6.workers.dev/"

# The Worker that classifies words "Type a feeling" doesn't know (see worker/README.md).
# Empty = unknown words are simply not understood, and nothing is ever sent.
classify_endpoint: "https://marco.soheilhraad-0e6.workers.dev/"

permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Every page names its language (`lang`) and a shared `ref`; pages with the same `ref` are
# translations of each other, which is how the language switcher finds them. English is the
# default and lives at the root; the others live under /es/ and /fa/. Interface text for all
# three is in _data/i18n.yml.
languages: [en, es, fa]

# The link-preview picture used when a page is shared (WhatsApp, LinkedIn, ...). A page can
# set its own `image:` to override it (project pages use their poster).
# No twitter:site / twitter:creator until a real handle exists: don't add `username:` here.
twitter:
  card: summary_large_image

defaults:
  - scope: { path: "" }
    values: { lang: en, locale: en_GB, image: /assets/img/og.png }
  - scope: { path: "es" }
    values:
      lang: es
      locale: es_ES
      description: Herramientas pequeñas para gente entre idiomas.
  - scope: { path: "fa" }
    values:
      lang: fa
      locale: fa_IR
      description: ابزارهای کوچک برای کسانی که میان زبان‌ها زندگی می‌کنند.

exclude:
  - README.md
  - CLAUDE.md
  - NOTES.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - worker
