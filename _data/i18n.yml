  detail_built: "How it's built"
  footer_rss: RSS
  write_to_us: Write to us
  slides_label: Slides
  slides_hint: "%n slides. Swipe, scroll sideways or use the arrow keys."
  slides_in_english: The slides are in English.
  feeling:
    label: "Type a feeling"
    how: "Write one word for how you feel, in English, Spanish or Persian. Press play and you will hear it as a few seconds of music."
    try: "Try one:"
    placeholder: "e.g. longing"
    submit: "Hear it"
    examples: "Examples"
    again: "Hear again"
    hear: "Hear it"
    share: "Copy link"
    copied: "Copied"
    unknown: "I don't know that feeling yet. Try another word: longing, calm, fear."
    note: "Words it knows are matched on your device. Any other word is sent to Cloudflare, whose AI model (Google's Gemma 4) classifies it; this site doesn't store it. The cues come from music-emotion research, mostly with Western listeners. Other traditions differ."
    emotions:
      joy:
        name: "Joy"
        cue: "Major mode, quick tempo, bright and detached notes. Listeners tend to hear these cues as joy."
      sadness:
        name: "Sadness"
        cue: "Minor mode, slow tempo, low register, a falling line. The cues most often heard as sadness."
      calm:
        name: "Calm"
        cue: "Few notes, soft and slow, with wide gaps between them. Little change is what reads as calm."
      fear:
        name: "Fear"
        cue: "Dissonant steps, uneven rhythm, a slow swell in volume. The cues of unease."
      anger:
        name: "Anger"
        cue: "Fast, loud, harsh in timbre: short repeated notes in a low register."
      tenderness:
        name: "Tenderness"
        cue: "Soft, slow and rounded, with a gently rocking line. Warmth comes from gentleness, not speed."
      longing:
        name: "Longing"
        cue: "Minor colour with a lifted sixth, a slow arch, and an ending that never resolves."
      wonder:
        name: "Wonder"
        cue: "Lydian colour, rising leaps, a high register and a shimmer of echo."
      hope:
        name: "Hope"
        cue: "A major line that keeps climbing, and lands only at the very end."
    modes:
      major: "major"
      minor: "minor"
      dorian: "dorian"
      lydian: "lydian"
      phrygian: "phrygian"
      locrian: "locrian"
      pentaMaj: "major pentatonic"
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  months_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
