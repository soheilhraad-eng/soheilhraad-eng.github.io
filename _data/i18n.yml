  chat_intro: به مارکو یک بذر بدهید، حتی یک کلمه، تا در سه حرکت از آن جرقه بسازد، پرورشش دهد و یک کارت ایده به شما بدهد.
  chat_starters: [غافلگیرم کن, یک پروژه برای کوچ‌نشین‌های دیجیتال, چیزی با زبان‌ها]
  chat_moves: [جرقه, پرورش, کارت ایده]
  chat_placeholder: یک بذر بنویسید، یک کلمه، یک حدس…
  chat_send: ارسال
  chat_left: "{n} پیام از ۳ پیام باقی مانده"
  chat_done: این کارت ایده شماست. می‌خواهید آن را بسازید؟
  chat_disclosure: مارکو یک هوش مصنوعی است (Gemma 4 از گوگل، اجراشده توسط Cloudflare)، نه یک انسان. پیام‌های شما برای نوشتن پاسخ‌هایش به Cloudflare فرستاده می‌شوند؛ این سایت آن‌ها را ذخیره نمی‌کند. لطفاً اطلاعات شخصی به اشتراک نگذارید.
  chat_error: مارکو الان نمی‌تواند پاسخ دهد. لطفاً بعداً دوباره امتحان کنید.
  chat_rate: پیام‌ها پشت سر هم زیاد شد. یک دقیقه صبر کنید و دوباره امتحان کنید.
  chat_thinking: مارکو در حال فکر کردن است…
  chat_marco: مارکو
  chat_you: شما
  slides_label: اسلایدها
  slides_hint: "%n اسلاید. بکشید، به پهلو اسکرول کنید یا از کلیدهای جهت‌نما استفاده کنید."
  slides_in_english: اسلایدها به انگلیسی هستند.
