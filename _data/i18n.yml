  start_project: Start a project
  chat_title: Marco, the idea engine
  chat_intro: Give Marco a seed, even a single word, and in three moves he'll spark, develop and hand you an idea card.
  chat_starters: [Surprise me, A side project for nomads, Something with languages]
  chat_moves: [Spark, Develop, Idea card]
  chat_placeholder: Type a seed, a word, a hunch…
  chat_send: Send
  chat_left: "{n} of 3 messages left"
  chat_done: That's your idea card. Want to build it?
  chat_disclosure: Marco is an AI (Google's Gemma 4, run by Cloudflare), not a person. Your messages are sent to Cloudflare to write his replies; this site doesn't store them. Please don't share personal details.
  chat_error: Marco can't answer right now. Please try again later.
  chat_rate: That's a lot of messages at once. Wait a minute and try again.
  chat_thinking: Marco is thinking…
  chat_marco: Marco
  chat_you: You
  slides_label: Slides
  slides_hint: "%n slides. Swipe, scroll sideways or use the arrow keys."
  slides_in_english: The slides are in English.
  chat_ui:
    pick: "Let's develop: %s"
    or_type: Pick one, or type your own mix or twist.
    make_card: Make my idea card
    or_answer: Or answer Marco's question below.
    who: Who it's for
    twist: The twist
    experiment: First experiment
    steps: First steps
    risk: Watch out for
    card: Idea card
    ready: Your idea card is ready.
    download: Download image
    copy: Copy text
    copied: Copied
    show_chat: See the conversation
    show_card: Back to the card
    ai_mark: Generated by AI (Gemma 4) with Marco
  feeling:
    label: "Type a feeling"
    submit: "Hear it"
    examples: "Examples"
    again: "Hear again"
    hear: "Hear it"
    share: "Copy link"
    copied: "Copied"
    unknown: "I don't know that feeling yet. Try another word: longing, calm, fear."
    note: "Words it knows are matched on your device. Any other word is sent to Cloudflare, whose AI model (Google's Gemma 4) classifies it; this site doesn't store it. The cues come from music-emotion research, mostly with Western listeners. Other traditions differ."
    emotions:
      joy:
        name: "Joy"
        cue: "Major mode, quick tempo, bright and detached notes. Listeners tend to hear these cues as joy."
      sadness:
        name: "Sadness"
        cue: "Minor mode, slow tempo, low register, a falling line. The cues most often heard as sadness."
      calm:
        name: "Calm"
        cue: "Few notes, soft and slow, with wide gaps between them. Little change is what reads as calm."
      fear:
        name: "Fear"
        cue: "Dissonant steps, uneven rhythm, a slow swell in volume. The cues of unease."
      anger:
        name: "Anger"
        cue: "Fast, loud, harsh in timbre: short repeated notes in a low register."
      tenderness:
        name: "Tenderness"
        cue: "Soft, slow and rounded, with a gently rocking line. Warmth comes from gentleness, not speed."
      longing:
        name: "Longing"
        cue: "Minor colour with a lifted sixth, a slow arch, and an ending that never resolves."
      wonder:
        name: "Wonder"
        cue: "Lydian colour, rising leaps, a high register and a shimmer of echo."
      hope:
        name: "Hope"
        cue: "A major line that keeps climbing, and lands only at the very end."
    modes:
      major: "major"
      minor: "minor"
      dorian: "dorian"
      lydian: "lydian"
      phrygian: "phrygian"
      locrian: "locrian"
      pentaMaj: "major pentatonic"
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  months_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
