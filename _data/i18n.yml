    label: "Pick a feeling"
    pad: "Touch the map"
    why: "Why this sound?"
    placeholder: "or type a feeling"
    submit: "Hear it"
    examples: "Examples"
    again: "Hear again"
    hear: "Hear it"
    share: "Copy link"
    copied: "Copied"
    unknown: "I don't know that feeling yet. Try another word: longing, calm, fear."
    note: "Known words are matched on your device. Other words go to an AI model at Cloudflare to be classified; this site stores nothing. Based on music-emotion research, mostly with Western listeners."
    sound: "Sound"
    timbre_auto: "Auto"
    timbre_keys: "Keys"
    timbre_strings: "Strings"
    take: "Another take"
    emotions:
      joy:
        name: "Joy"
        cue: "Major mode, quick tempo, bright and detached notes. Listeners tend to hear these cues as joy."
      sadness:
        name: "Sadness"
        cue: "Minor mode, slow tempo, low register, a falling line. The cues most often heard as sadness."
      calm:
        name: "Calm"
        cue: "Few notes, soft and slow, with wide gaps between them. Little change is what reads as calm."
      fear:
        name: "Fear"
        cue: "Dissonant steps, uneven rhythm, a slow swell in volume. The cues of unease."
      anger:
        name: "Anger"
        cue: "Fast, loud, harsh in timbre: short repeated notes in a low register."
      tenderness:
        name: "Tenderness"
        cue: "Soft, slow and rounded, with a gently rocking line. Warmth comes from gentleness, not speed."
      longing:
        name: "Longing"
        cue: "Minor colour with a lifted sixth, a slow arch, and an ending that never resolves."
      wonder:
        name: "Wonder"
        cue: "Lydian colour, rising leaps, a high register and a shimmer of echo."
      hope:
        name: "Hope"
        cue: "A major line that keeps climbing, and lands only at the very end."
    modes:
      major: "major"
      minor: "minor"
      dorian: "dorian"
      lydian: "lydian"
      phrygian: "phrygian"
      locrian: "locrian"
      pentaMaj: "major pentatonic"
