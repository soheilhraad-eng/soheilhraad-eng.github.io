  chat_title: Marco, el motor de ideas
  chat_intro: Dale a Marco una semilla, aunque sea una sola palabra, y en tres movimientos la hará chispa, la desarrollará y te entregará una ficha de idea.
  chat_starters: [Sorpréndeme, Un proyecto para nómadas, Algo con idiomas]
  chat_moves: [Chispa, Desarrollo, Ficha]
  chat_placeholder: Escribe una semilla, una palabra, una corazonada…
  chat_send: Enviar
  chat_left: "Te quedan {n} de 3 mensajes"
  chat_done: Esa es tu ficha de idea. ¿Quieres construirla?
  chat_disclosure: Marco es una IA (Gemma 4 de Google, ejecutada por Cloudflare), no una persona. Tus mensajes se envían a Cloudflare para escribir sus respuestas; este sitio no los guarda. Por favor, no compartas datos personales.
  chat_error: Marco no puede responder ahora mismo. Inténtalo de nuevo más tarde.
  chat_rate: Son muchos mensajes seguidos. Espera un minuto y vuelve a intentarlo.
  chat_thinking: Marco está pensando…
  chat_marco: Marco
  chat_you: Tú
  slides_label: Diapositivas
  slides_hint: "%n diapositivas. Desliza, desplázate a un lado o usa las flechas."
  slides_in_english: Las diapositivas están en inglés.
  chat_ui:
    pick: "Desarrollemos: %s"
    or_type: Elige una, o escribe tu propia mezcla o giro.
    make_card: Crear mi ficha de idea
    or_answer: O responde abajo a la pregunta de Marco.
    who: Para quién es
    twist: El giro
    experiment: Primer experimento
    steps: Primeros pasos
    risk: Cuidado con
    card: Ficha de idea
    ready: Tu ficha de idea está lista.
    download: Descargar imagen
