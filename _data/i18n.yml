    ai_mark: ساخته‌شده با هوش مصنوعی (Gemma 4) و مارکو
  feeling:
    label: "یک احساس بنویسید"
    submit: "بشنو"
    examples: "نمونه‌ها"
    again: "دوباره"
    hear: "بشنو"
    share: "کپی پیوند"
    copied: "کپی شد"
    unknown: "این احساس را هنوز نمی‌شناسم. کلمهٔ دیگری امتحان کنید: دلتنگی، آرامش، ترس."
    note: "واژه‌هایی که می‌شناسد روی دستگاه شما تطبیق داده می‌شوند. هر واژهٔ دیگر به Cloudflare فرستاده می‌شود و مدل هوش مصنوعی آن (Gemma 4 از گوگل) آن را دسته‌بندی می‌کند؛ این سایت آن را ذخیره نمی‌کند. این نشانه‌ها از پژوهش‌های موسیقی و هیجان می‌آیند که بیشتر با شنوندگان غربی انجام شده‌اند. سنت‌های دیگر متفاوت‌اند."
    emotions:
      joy:
        name: "شادی"
        cue: "گام ماژور، ضرب تند، نت‌های روشن و کوتاه. شنونده‌ها معمولاً این نشانه‌ها را شادی می‌شنوند."
      sadness:
        name: "اندوه"
        cue: "گام مینور، ضرب کند، صدای بم، خط ملودی رو به پایین. نشانه‌هایی که بیشتر اندوه شنیده می‌شوند."
      calm:
        name: "آرامش"
        cue: "نت‌های کم، نرم و کند، با فاصله‌های بلند. تغییر اندک، آرامش می‌سازد."
      fear:
        name: "ترس"
        cue: "گام‌های ناهماهنگ، ریتم نامنظم، بلندشدن آهستهٔ صدا. نشانه‌های دلهره."
      anger:
        name: "خشم"
        cue: "تند، بلند، با صدایی خشن: نت‌های کوتاه و تکراری در ناحیهٔ بم."
      tenderness:
        name: "مهربانی"
        cue: "نرم، کند و گرد، با خطی که آرام تاب می‌خورد. گرما از نرمی می‌آید، نه از سرعت."
      longing:
        name: "دلتنگی"
        cue: "رنگ مینور با درجهٔ ششم بالارفته، قوسی کند و پایانی که حل نمی‌شود."
      wonder:
        name: "شگفتی"
        cue: "رنگ لیدین، جهش‌های رو به بالا، صدای زیر و کمی پژواک."
      hope:
        name: "امید"
        cue: "خطی ماژور که پیوسته بالا می‌رود و فقط در پایان فرود می‌آید."
    modes:
      major: "ماژور"
      minor: "مینور"
      dorian: "دورین"
      lydian: "لیدین"
      phrygian: "فریژین"
      locrian: "لوکرین"
      pentaMaj: "پنتاتونیک ماژور"
