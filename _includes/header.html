<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      {% for item in site.nav %}
        {% assign current = page.url | slice: 0, item.url.size %}
        <a href="{{ item.url | relative_url }}"{% if current == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
