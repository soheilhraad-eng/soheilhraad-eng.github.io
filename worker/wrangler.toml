# Only needed if you deploy with the command line (npx wrangler deploy).
# Deploying through the Cloudflare dashboard doesn't use this file.
name = "marco"
main = "worker.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

# Per-visitor rate limit: 6 messages a minute from one address.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
